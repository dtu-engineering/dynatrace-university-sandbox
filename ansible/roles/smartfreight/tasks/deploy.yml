---
# Mirrors deploy/ec2_bootstrap.sh Phases 1-4: namespace + ECR pull secret,
# application secrets, in-cluster Postgres, then the six SmartFreight
# services. Every kubectl call goes through `--dry-run=client -o yaml |
# kubectl apply -f -` and every helm call is `upgrade --install`, so
# re-running this role converges instead of erroring or duplicating state.

- name: Require smartfreight_postgres_password to be set
  ansible.builtin.assert:
    that:
      - smartfreight_postgres_password | length > 0
    fail_msg: "smartfreight_postgres_password must be set (see ec2_bootstrap.sh POSTGRES_PASSWORD)."

- name: Require ingress_domain to be set
  ansible.builtin.assert:
    that:
      - ingress_domain is defined
      - ingress_domain | length > 0
    fail_msg: "ingress_domain must be set"

# ── Phase 1: namespace + ECR pull secret ────────────────────────────────────

- name: Ensure SmartFreight namespace exists
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create namespace "{{ smartfreight_namespace }}" --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_ns
  changed_when: "'created' in smartfreight_ns.stdout or 'configured' in smartfreight_ns.stdout"

- name: Resolve ECR registry from account ID
  ansible.builtin.command: aws sts get-caller-identity --query Account --output text --region {{ smartfreight_aws_region }}
  register: smartfreight_aws_account
  changed_when: false
  when: smartfreight_ecr_registry | length == 0

- name: Set effective ECR registry fact
  ansible.builtin.set_fact:
    smartfreight_ecr_registry_resolved: >-
      {{ smartfreight_ecr_registry
         if smartfreight_ecr_registry | length > 0
         else smartfreight_aws_account.stdout ~ '.dkr.ecr.' ~ smartfreight_aws_region ~ '.amazonaws.com' }}

- name: Get ECR authorization token
  ansible.builtin.command: aws ecr get-login-password --region {{ smartfreight_aws_region }}
  register: smartfreight_ecr_password
  changed_when: false
  no_log: true

- name: Create/refresh ECR image pull secret
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create secret docker-registry ecr-pull-secret \
      --docker-server="{{ smartfreight_ecr_registry_resolved }}" \
      --docker-username=AWS \
      --docker-password="{{ smartfreight_ecr_password.stdout }}" \
      -n "{{ smartfreight_namespace }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_ecr_secret
  changed_when: "'created' in smartfreight_ecr_secret.stdout or 'configured' in smartfreight_ecr_secret.stdout"
  no_log: true

# ── Phase 2: application secrets ────────────────────────────────────────────

- name: Create tms-api Postgres secret
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create secret generic tms-api-secrets -n "{{ smartfreight_namespace }}" \
      --from-literal=postgres-password="{{ smartfreight_postgres_password }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_postgres_secret
  changed_when: "'created' in smartfreight_postgres_secret.stdout or 'configured' in smartfreight_postgres_secret.stdout"
  no_log: true

- name: Create admin-auth secret
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create secret generic admin-auth-secrets -n "{{ smartfreight_namespace }}" \
      --from-literal=admin-username="{{ smartfreight_admin_username }}" \
      --from-literal=admin-password="{{ smartfreight_admin_password }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_admin_secret
  changed_when: "'created' in smartfreight_admin_secret.stdout or 'configured' in smartfreight_admin_secret.stdout"
  no_log: true
  when:
    - smartfreight_admin_username | length > 0
    - smartfreight_admin_password | length > 0

- name: Create Opentelemetry Ingest Token
  include_role:
    name: dynatrace-settings
    tasks_from: opentelemetry-token.yml

- name: Create Dynatrace secret
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create secret generic dynatrace-secrets -n "{{ smartfreight_namespace }}" \
      --from-literal=dt-tenant-url="{{ dynatrace_environment_url }}" \
      --from-literal=dt-api-token="{{ dynatrace_opentelemetry_token }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_dynatrace_secret
  changed_when: "'created' in smartfreight_dynatrace_secret.stdout or 'configured' in smartfreight_dynatrace_secret.stdout"
  no_log: true
  when:
    - dynatrace_environment_url | length > 0
    - dynatrace_opentelemetry_token | length > 0

# ── Phase 3: in-cluster PostgreSQL ──────────────────────────────────────────

- name: Add/update the Bitnami helm repo
  ansible.builtin.shell: |
    helm repo add bitnami https://charts.bitnami.com/bitnami >/dev/null 2>&1 || true
    helm repo update bitnami >/dev/null
  args:
    executable: /bin/bash
  changed_when: false

- name: Install/upgrade in-cluster PostgreSQL
  ansible.builtin.shell: |
    helm upgrade --install postgresql bitnami/postgresql \
      --namespace "{{ smartfreight_namespace }}" --create-namespace \
      --set auth.username=smartfreight \
      --set auth.password="{{ smartfreight_postgres_password }}" \
      --set auth.database=smartfreight \
      --set auth.postgresPassword="{{ smartfreight_postgres_password }}" \
      --wait
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_postgres_install
  changed_when: "'STATUS: deployed' in smartfreight_postgres_install.stdout or 'STATUS: upgraded' in smartfreight_postgres_install.stdout"
  no_log: true

# ── Phase 4: SmartFreight services ──────────────────────────────────────────

- name: Install/upgrade tms-api
  ansible.builtin.shell: |
    helm upgrade --install tms-api "{{ smartfreight_helm_charts_dir }}/tms-api" \
      --namespace "{{ smartfreight_namespace }}" \
      --set "image.repository={{ smartfreight_ecr_registry_resolved }}/{{ smartfreight_ecr_repo_prefix }}/tms-api" \
      --set "image.tag={{ smartfreight_image_tag }}" \
      --set imagePullSecret=ecr-pull-secret \
      --set postgres.host=postgresql \
      --set service.type=ClusterIP \
      --wait --timeout 10m
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_tms_api_install
  changed_when: "'STATUS: deployed' in smartfreight_tms_api_install.stdout or 'STATUS: upgraded' in smartfreight_tms_api_install.stdout"
  failed_when: false

- name: Install/upgrade tms-agent-service
  ansible.builtin.shell: |
    helm upgrade --install tms-agent-service "{{ smartfreight_helm_charts_dir }}/tms-agent-service" \
      --namespace "{{ smartfreight_namespace }}" \
      --set "image.repository={{ smartfreight_ecr_registry_resolved }}/{{ smartfreight_ecr_repo_prefix }}/tms-agent-service" \
      --set "image.tag={{ smartfreight_image_tag }}" \
      --set imagePullSecret=ecr-pull-secret \
      --set "aws.region={{ smartfreight_aws_region }}" \
      --set "bedrock.routePlannerModel={{ smartfreight_bedrock_route_planner_model }}" \
      --set "bedrock.shipmentModel={{ smartfreight_bedrock_shipment_model }}" \
      --wait
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_tms_agent_install
  changed_when: "'STATUS: deployed' in smartfreight_tms_agent_install.stdout or 'STATUS: upgraded' in smartfreight_tms_agent_install.stdout"

- name: Install/upgrade weather-agent-service
  ansible.builtin.shell: |
    helm upgrade --install weather-agent-service "{{ smartfreight_helm_charts_dir }}/weather-agent-service" \
      --namespace "{{ smartfreight_namespace }}" \
      --set "image.repository={{ smartfreight_ecr_registry_resolved }}/{{ smartfreight_ecr_repo_prefix }}/weather-agent-service" \
      --set "image.tag={{ smartfreight_image_tag }}" \
      --set imagePullSecret=ecr-pull-secret \
      --set "aws.region={{ smartfreight_aws_region }}" \
      --set "bedrock.weatherModel={{ smartfreight_bedrock_weather_model }}" \
      --wait
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_weather_agent_install
  changed_when: "'STATUS: deployed' in smartfreight_weather_agent_install.stdout or 'STATUS: upgraded' in smartfreight_weather_agent_install.stdout"

- name: Install/upgrade agent-service
  ansible.builtin.shell: |
    helm upgrade --install agent-service "{{ smartfreight_helm_charts_dir }}/agent-service" \
      --namespace "{{ smartfreight_namespace }}" \
      --set "image.repository={{ smartfreight_ecr_registry_resolved }}/{{ smartfreight_ecr_repo_prefix }}/agent-service" \
      --set "image.tag={{ smartfreight_image_tag }}" \
      --set imagePullSecret=ecr-pull-secret \
      --set "aws.region={{ smartfreight_aws_region }}" \
      --set "bedrock.supervisorModel={{ smartfreight_bedrock_supervisor_model }}" \
      --set "bedrock.pricingModel={{ smartfreight_bedrock_pricing_model }}" \
      --set "bedrock.guardrailJudgeModel={{ smartfreight_bedrock_guardrail_judge_model }}" \
      --wait
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_agent_install
  changed_when: "'STATUS: deployed' in smartfreight_agent_install.stdout or 'STATUS: upgraded' in smartfreight_agent_install.stdout"

# ClusterIP, not LoadBalancer: the ALB + Traefik Ingress (tasks/ingress.yml)
# is the public entry point, so no k3s ServiceLB address is needed here.
- name: Install/upgrade frontend
  ansible.builtin.shell: |
    helm upgrade --install frontend "{{ smartfreight_helm_charts_dir }}/frontend" \
      --namespace "{{ smartfreight_namespace }}" \
      --set "image.repository={{ smartfreight_ecr_registry_resolved }}/{{ smartfreight_ecr_repo_prefix }}/frontend" \
      --set "image.tag={{ smartfreight_image_tag }}" \
      --set imagePullSecret=ecr-pull-secret \
      --set service.type=ClusterIP \
      --set tmsApiUrl=http://tms-api:8000 \
      --wait
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_frontend_install
  changed_when: "'STATUS: deployed' in smartfreight_frontend_install.stdout or 'STATUS: upgraded' in smartfreight_frontend_install.stdout"

- name: Install/upgrade load-generator
  ansible.builtin.shell: |
    helm upgrade --install load-generator "{{ smartfreight_helm_charts_dir }}/load-generator" \
      --namespace "{{ smartfreight_namespace }}" \
      --set "image.repository={{ smartfreight_ecr_registry_resolved }}/{{ smartfreight_ecr_repo_prefix }}/load-generator" \
      --set "image.tag={{ smartfreight_image_tag }}" \
      --set imagePullSecret=ecr-pull-secret \
      --wait
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_load_generator_install
  changed_when: "'STATUS: deployed' in smartfreight_load_generator_install.stdout or 'STATUS: upgraded' in smartfreight_load_generator_install.stdout"

- name: Wait for SmartFreight deployments to exist
  ansible.builtin.command: kubectl -n "{{ smartfreight_namespace }}" get deployment
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: smartfreight_deployments
  changed_when: false
  retries: 10
  delay: 3
  until: smartfreight_deployments.rc == 0
