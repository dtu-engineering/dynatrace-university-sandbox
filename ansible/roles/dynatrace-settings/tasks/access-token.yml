---

- name: Create Dynatrace Settings Token
  uri:
    url: "{{ dynatrace_environment_url }}/api/v2/apiTokens"
    method: POST
    status_code: [200, 201]
    body:
      name: "Dynatrace Settings Token"
      scopes:
        - settings.read
        - settings.write
        - securityProblems.write
    body_format: json
    headers:
      Authorization: "Api-Token {{ dynatrace_environment_token }}"
  register: dynatrace_settings_token_result
  when: not dynatrace_use_platform_token

- name: Set Dynatrace Settings Token Fact (minted access token)
  set_fact:
    dynatrace_settings_token: "{{ dynatrace_settings_token_result.json.token }}"
    dynatrace_settings_auth_header: "Api-Token {{ dynatrace_settings_token_result.json.token }}"
  when: not dynatrace_use_platform_token

# The platform token already carries settings.read/settings.write/
# securityProblems.write (and everything else this sandbox needs) - use it
# directly instead of minting a narrowly-scoped token.
- name: Set Dynatrace Settings Token Fact (platform token)
  set_fact:
    dynatrace_settings_token: "{{ dynatrace_environment_token }}"
    dynatrace_settings_auth_header: "Bearer {{ dynatrace_environment_token }}"
  when: dynatrace_use_platform_token