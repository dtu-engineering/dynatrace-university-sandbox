---

- name: Clone Easytrade Repo
  ansible.builtin.git:
    repo: "{{ easytrade_remote_origin }}"
    dest: "{{ role_path }}/files/easytrade"
    version: "{{ easytrade_release_version }}"
    depth: 1
    force: true
  register: git_clone
  retries: "{{ network_task_retries }}"
  delay: "{{ network_task_delay }}"
  until: git_clone is succeeded

- name: Ensure easytrade namespace exists
  ansible.builtin.shell: |
    kubectl get namespace "{{ easytrade_namespace }}" || kubectl create namespace "{{ easytrade_namespace }}"
  register: easytrade_ns
  changed_when: "'created' in easytrade_ns.stdout"

- name: Install Easytrade Helm chart
  ansible.builtin.shell: |
    helm upgrade --install easytrade \
      {{ role_path }}/files/easytrade/helm/easytrade \
      --namespace "{{ easytrade_namespace }}" \
      --create-namespace \
      --wait \
      --timeout 20m
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: easytrade_install
  changed_when: "'STATUS: deployed' in easytrade_install.stdout or 'STATUS: upgraded' in easytrade_install.stdout"

- name: Wait for Easytrade deployments to exist
  ansible.builtin.shell: kubectl -n "{{ easytrade_namespace }}" get deployment
  register: easytrade_deployments
  retries: 10
  delay: 3
  until: easytrade_deployments.rc == 0

# The chart is re-cloned fresh on every run (force: true above), so any resource
# tuning has to be reapplied post-install rather than edited into the cloned chart
# directly, which would just get overwritten. CPU request trimmed from 500m —
# observed usage was ~20-24m at idle on a t3a.2xlarge capacity sizing pass.
# Memory left untouched (request already close to observed RSS).
- name: Rightsize easytrade-db CPU request (t3a.2xlarge capacity pass)
  ansible.builtin.shell: |
    kubectl -n "{{ easytrade_namespace }}" set resources statefulset easytrade-db --requests=cpu=100m
  register: easytrade_db_resize
  retries: 5
  delay: 5
  until: easytrade_db_resize.rc == 0
  changed_when: "'resource requirements updated' in easytrade_db_resize.stdout"
