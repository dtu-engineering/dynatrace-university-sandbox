# Ansible configuration for the DTU sandbox playbooks.
#
# This file is only picked up if ANSIBLE_CONFIG points at it, because the
# userdata script invokes ansible-playbook by absolute path from a working
# directory that is not this one. run_ansible.sh exports:
#
#   ANSIBLE_CONFIG=$ANSIBLE_WORK_DIR/ansible/ansible.cfg
#
# Running the playbook by hand from this directory picks it up automatically.

[defaults]
# profile_tasks prints a per-task duration table at the end of the run and a
# running elapsed time against each task; timer prints total wall clock.
# Everything goes to stdout, which the userdata script redirects (with 2>&1)
# into /tmp/bootstrap.log for the CloudWatch agent to forward.
#
# community.general.opentelemetry builds one trace per `ansible-playbook`
# invocation: a single root span named after the playbook file, with one
# flat child span per task (no per-role or per-play span level despite what
# an earlier version of this comment said). All spans are generated and
# exported once, at the very end of the run (v2_playbook_on_stats) - nothing
# streams mid-playbook, and a failed run still exports (the rescue block lets
# the playbook reach its end). Stays dormant unless ANSIBLE_OPENTELEMETRY_ENABLED
# is true - see [callback_opentelemetry] below.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer, community.general.opentelemetry

# Keep the human-readable output as-is; the callbacks above are additive.
stdout_callback = default

# Boot logs are not a terminal, and retry files are noise on an ephemeral host.
retry_files_enabled = False
interpreter_python = auto_silent

[callback_profile_tasks]
# Show every task, slowest first. The sandbox build is ~200 tasks and the
# point of enabling this is to find the long poles.
task_output_limit = 200
sort_order = descending

[callback_opentelemetry]
# Tracing is opt-in. The userdata script only exports
# ANSIBLE_OPENTELEMETRY_ENABLED=true when an OTLP endpoint has been configured
# on the Aether template, so local and unconfigured runs are unaffected.
enable_from_environment = ANSIBLE_OPENTELEMETRY_ENABLED
otel_service_name = dtu-sandbox-ansible

# disable_logs=false attaches each task's full result (the same content
# ansible would print: cmd, stdout, stderr, msg, rc) to its span as a log
# event, so task output is correlated with the trace instead of only living
# in /tmp/bootstrap.log.
disable_logs = false
# Still keep the span's own attributes (module, message, name, result,
# host.name, host.status) from being duplicated onto the log event too -
# redundant with what's already on the span, not a secrecy control by
# itself.
disable_attributes_in_logs = true

# hide_task_arguments=true is the actual secret control, and is required
# once disable_logs=false. Several roles pass tokens/passwords directly as
# shell/command arguments (e.g. dynatrace-operator's
# `kubectl create secret ... --from-literal="apiToken={{ token }}"`), and the
# plugin attaches a task's *args* as span attributes (ansible.task.args.value)
# unconditionally, regardless of disable_logs - hiding them is the only way
# to keep that out of the trace. This does not touch stdout/stderr/msg inside
# a task's *result* (the log event above), so a task whose output alone can
# contain a secret still needs `no_log: true` on that specific task - ansible
# itself redacts the result before any callback (including this one) sees it.
# None of our roles currently rely on hide_task_arguments being false, so
# this is a strict improvement with no known downside.
hide_task_arguments = true
